[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FreeLLMAPI — OpenAI-compatible proxy over free-tier providers"
default-run = "server"

[[bin]]
name = "freellmapi-cli"
path = "src/bin/freellmapi_cli.rs"

[[bin]]
name = "freellmapi-tray"
path = "src/bin/freellmapi_tray.rs"
required-features = ["desktop-tray"]

[features]
desktop-tray = [
    "dep:dirs",
    "dep:gtk",
    "dep:libc",
    "dep:open",
    "dep:tray-icon",
    "dep:winit",
]

[dependencies]
getmodelsapi = { path = "../getmodelsapi" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { version = "0.8", features = ["multipart"] }
# Pinned: the sqlite adapter is ported locally (see src/auth/sqlite.rs) because
# better-auth's bundled sqlite adapter would pull a second libsqlite3-sys.
better-auth = { git = "https://github.com/nglmercer/better-auth-rs", rev = "1b1a6cdca121055e7f3eee166a6f88f602f4c5d6", default-features = false, features = ["axum"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
aes-gcm = "0.10"
async-trait = "0.1"
sha1 = "0.10"
sha2 = "0.10"
async-stream = "0.3"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
dirs = { version = "6", optional = true }
libc = { version = "0.2", optional = true }
open = { version = "5.4", optional = true }
tray-icon = { version = "0.24.2", optional = true }
winit = { version = "0.30", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
futures = "0.3"
