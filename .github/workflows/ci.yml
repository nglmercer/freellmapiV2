name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    name: Rust server — test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build server (release)
        run: cargo build --release -p server

  desktop:
    name: Desktop tray — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tray native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev libgtk-3-dev libxdo-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build desktop tray
        run: cargo build -p server --bin freellmapi-tray --features desktop-tray

      - name: Clippy desktop targets
        run: cargo clippy -p server --all-targets --features desktop-tray -- -D warnings

      - name: Linux tray runtime smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          output="$(FREELLMAPI_TRAY_SMOKE_TEST=1 xvfb-run -a timeout 10s ./target/debug/freellmapi-tray)"
          echo "$output"
          grep -Fq "Tray ready" <<< "$output"

  client:
    name: Client — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client
